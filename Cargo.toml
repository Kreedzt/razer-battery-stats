[package]
name = "razer-battery-taskbar"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Taskbar battery panel for Razer mice"
license = "MIT"
repository = "https://github.com/Kreedzt/razer-battery-stats"
readme = "README.md"
authors = ["Kreedzt"]
publish = false

[dependencies]
razer-hid = { git = "https://github.com/xzeldon/razer-battery-report", tag = "v1.3.0" }
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_Security",
    "Win32_UI_Accessibility",
    "Win32_UI_HiDpi",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
opt-level = "s"
strip = true
